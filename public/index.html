<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Dashboard</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}.nav{background:#172033;padding:14px 22px;display:flex;gap:20px}.nav a{color:white;text-decoration:none;font-weight:700}.wrap{max-width:1180px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 16px #0001}.big{font-size:28px;font-weight:700}.muted{color:#667085}button,input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;margin:5px 0}button{background:#172033;color:#fff;font-weight:700;cursor:pointer}.post{border:1px solid #eee;border-radius:12px;padding:12px;margin:8px 0}.post img{max-width:150px;max-height:150px;border-radius:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="nav"><a href="/">Dashboard</a><a href="/settings.html">ตั้งค่า</a><a href="/create.html">สร้างแอด</a></div><div class="wrap"><h1>Dashboard</h1><p class="muted">Shopee AFF AI Ads Manager</p><div class="grid"><div class="card">ค่าแอดวันนี้<div class="big">฿0</div></div><div class="card">Clicks วันนี้<div class="big">0</div></div><div class="card">Commission<div class="big">฿0</div></div></div><div class="card" style="margin-top:15px"><h2>สถานะโฆษณาล่าสุด</h2><p id="sync" role="status" aria-live="polite">กำลังเชื่อมต่อ Meta…</p><p class="muted">อัปเดตอัตโนมัติทุก 30 วินาที • แสดง 100 รายการล่าสุด</p><button onclick="load()">รีเฟรช Ads</button><div id="ads">กำลังรอข้อมูล</div></div></div><script>
let busy=false;
const labels={ACTIVE:'เปิดใช้งาน',PAUSED:'หยุดไว้',CAMPAIGN_PAUSED:'แคมเปญหยุดอยู่',ADSET_PAUSED:'ชุดโฆษณาหยุดอยู่',PENDING_REVIEW:'รอตรวจสอบ',IN_PROCESS:'กำลังประมวลผล',DISAPPROVED:'ไม่ผ่านการอนุมัติ',WITH_ISSUES:'มีปัญหา'};
async function load(){if(busy)return;busy=true;const sync=document.getElementById('sync');sync.textContent='กำลังอัปเดตสถานะจาก Meta…';try{const r=await fetch('/api/meta/ads',{cache:'no-store'}),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'โหลดข้อมูลไม่สำเร็จ');const box=document.getElementById('ads');box.replaceChildren();for(const a of j.data||[]){const p=document.createElement('div');p.className='post';const title=document.createElement('strong');title.textContent=a.name;p.append(title);const info=document.createElement('p');info.textContent='Ad ID: '+a.id+' | '+(labels[a.effective_status]||a.effective_status)+' | ตั้งไว้: '+(labels[a.status]||a.status);p.append(info);const detail=document.createElement('p');detail.textContent='งบ '+(Number(a.adset?.daily_budget||0)/100)+' บาท/วัน | เป้าหมาย: '+(a.adset?.optimization_goal==='LANDING_PAGE_VIEWS'?'ดูแลนดิ้งเพจ':a.adset?.optimization_goal||'—')+' | แคมเปญ: '+(labels[a.campaign?.status]||a.campaign?.status||'—')+' | ชุดโฆษณา: '+(labels[a.adset?.status]||a.adset?.status||'—')+' | ใช้วันนี้ '+(a.insights?.data?.[0]?.spend||0)+' บาท';p.append(detail);box.append(p)}if(!j.data?.length)box.textContent='ไม่พบโฆษณา';const totals=(j.data||[]).reduce((o,a)=>{const x=a.insights?.data?.[0]||{};o.spend+=Number(x.spend||0);o.clicks+=Number(x.clicks||0);return o},{spend:0,clicks:0});const nums=document.querySelectorAll('.big');nums[0].textContent='฿'+totals.spend.toFixed(2);nums[1].textContent=totals.clicks;sync.textContent='เชื่อมต่อสำเร็จ • อัปเดตล่าสุด '+new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok'})+' • '+(j.data||[]).length+' รายการ'}catch(e){sync.textContent='อัปเดตไม่สำเร็จ: '+e.message+' • จะลองใหม่ใน 30 วินาที (ข้อมูลเดิมอาจไม่เป็นปัจจุบัน)'}finally{busy=false}}
load();setInterval(load,30000);
</script></body></html>
