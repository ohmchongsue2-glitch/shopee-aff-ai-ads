<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>เข้าสู่ระบบ Shopee AFF Ads</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:420px;margin:8vh auto;padding:24px}.card{background:white;padding:28px;border-radius:18px;box-shadow:0 6px 28px #17203315}h1{font-size:26px}p{color:#667085;line-height:1.6}label{display:block;margin-top:16px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;border:1px solid #d0d5dd;font:inherit;margin-top:7px}button{background:#172033;color:white;cursor:pointer;margin-top:22px;font-weight:bold}button:disabled{opacity:.5}.check{display:flex;align-items:center;gap:8px}.check input{width:auto;margin:0}#message{color:#b42318;white-space:pre-wrap} [hidden]{display:none!important}</style><script src="/login.js" defer></script></head><body><main class="wrap"><div class="card"><h1 id="title">เข้าสู่ระบบ</h1><p id="intro">Shopee AFF AI Ads Manager<br>สำหรับผู้ดูแลที่ได้รับอนุญาต</p><form id="authForm"><div id="setupFields" hidden><label for="setupToken">รหัสตั้งค่าครั้งแรก</label><input id="setupToken" type="password" autocomplete="off" spellcheck="false"><p>ใช้รหัสที่ได้รับจากผู้ดูแลระบบเพื่อตั้งบัญชีครั้งแรก</p></div><label for="username">ชื่อผู้ใช้</label><input id="username" autocomplete="username" minlength="3" maxlength="64" required value="admin"><label for="password">รหัสผ่าน</label><input id="password" type="password" autocomplete="current-password" maxlength="128" required><div id="confirmFields" hidden><label for="confirm">ยืนยันรหัสผ่าน</label><input id="confirm" type="password" autocomplete="new-password" maxlength="128"><p>ใช้รหัสผ่านยาวอย่างน้อย 12 ตัวอักษร และไม่ซ้ำกับเว็บอื่น</p></div><label class="check" id="rememberFields"><input id="remember" type="checkbox">จดจำการเข้าสู่ระบบ 30 วันบนเครื่องนี้</label><button id="submit" type="submit" disabled>กำลังตรวจสอบ…</button></form><p id="message" role="status" aria-live="polite"></p></div></main></body></html>
