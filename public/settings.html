<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>ตั้งค่า</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}.nav{background:#172033;padding:14px 22px;display:flex;gap:20px}.nav a{color:white;text-decoration:none;font-weight:700}.wrap{max-width:1180px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 16px #0001}.big{font-size:28px;font-weight:700}.muted{color:#667085}button,input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;margin:5px 0}button{background:#172033;color:#fff;font-weight:700;cursor:pointer}.post{border:1px solid #eee;border-radius:12px;padding:12px;margin:8px 0}.post img{max-width:150px;max-height:150px;border-radius:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="nav"><a href="/">Dashboard</a><a href="/settings.html">ตั้งค่า</a><a href="/create.html">สร้างแอด</a></div><div class="wrap"><h1>ตั้งค่า</h1><div class="card"><h2>Facebook Pages</h2><p class="muted">ดึงทุกเพจที่ Token มีสิทธิ์เข้าถึง รองรับหลายเพจ</p><button onclick="pages()">ดึงเพจทั้งหมด</button><div id="pages"></div></div><div class="card" style="margin-top:15px"><h2>การเชื่อมต่อ</h2><p id="cfg">กำลังตรวจ...</p><p class="muted">ค่าการเชื่อมต่อถูกบันทึกถาวรบนเซิร์ฟเวอร์ ช่อง Token และ API Key จะว่างหลังบันทึกเพื่อไม่แสดงค่าลับ เว้นว่างเพื่อใช้ค่าที่บันทึกไว้เดิม</p><label>Meta Access Token</label><input id="metaToken" type="password" placeholder="วาง Meta Access Token ใหม่"><label>Meta Ad Account ID</label><input id="adAccount" placeholder="เช่น act_123456789"><label>OpenAI API Key</label><input id="openaiKey" type="password" placeholder="วาง OpenAI API Key ใหม่"><button onclick="save()">บันทึกค่าการเชื่อมต่อ</button><p id="saveMsg" role="status" aria-live="polite"></p></div></div><script>const metaToken=document.getElementById('metaToken'),adAccount=document.getElementById('adAccount'),openaiKey=document.getElementById('openaiKey'),saveMsg=document.getElementById('saveMsg'),cfg=document.getElementById('cfg');
async function pages(){const box=document.getElementById('pages');try{const r=await fetch('/api/meta/pages'),j=await r.json();box.replaceChildren();if(!r.ok||j.error)throw Error(j.error||'ดึงเพจไม่สำเร็จ');for(const p of j.data||[]){const card=document.createElement('div');card.className='post';card.textContent=p.name+' | Page ID: '+p.id;box.append(card)}}catch(e){box.textContent=e.message}}
async function save(){saveMsg.textContent='กำลังบันทึก...';try{const r=await fetch('/api/settings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({metaToken:metaToken.value,adAccount:adAccount.value,openaiKey:openaiKey.value})}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'บันทึกไม่สำเร็จ');metaToken.value='';openaiKey.value='';await loadCfg();saveMsg.textContent='บันทึกถาวรแล้ว รีเฟรชหรือรีสตาร์ตระบบค่าจะยังอยู่';await pages()}catch(e){saveMsg.textContent=e.message}}
async function loadCfg(){try{const r=await fetch('/api/config',{cache:'no-store'}),j=await r.json();if(!r.ok)throw Error('ตรวจสถานะไม่สำเร็จ');cfg.textContent='Meta Token: '+(j.metaTokenSaved?'บันทึกแล้ว':'ยังไม่มี')+' | บัญชีโฆษณา: '+(j.account||'ยังไม่ได้เลือก')+' | OpenAI Key: '+(j.openai?'บันทึกแล้ว':'ยังไม่มี')+' | การเก็บค่า: '+(j.persistent?'ถาวร':'ยังไม่พร้อม');adAccount.value=j.account||'';metaToken.placeholder=j.metaTokenSaved?'บันทึกแล้ว — ใส่เฉพาะเมื่อต้องการเปลี่ยน':'วาง Meta Access Token ใหม่';openaiKey.placeholder=j.openai?'บันทึกแล้ว — ใส่เฉพาะเมื่อต้องการเปลี่ยน':'วาง OpenAI API Key ใหม่'}catch(e){cfg.textContent=e.message;throw e}}
loadCfg().then(pages).catch(()=>{});</script></body></html>
