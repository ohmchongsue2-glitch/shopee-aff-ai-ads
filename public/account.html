<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>บัญชีผู้ดูแล</title><style>body{font-family:Arial;background:#f5f7fb;color:#172033;margin:0}.nav{background:#172033;padding:18px;display:flex;gap:18px;flex-wrap:wrap}.nav a{color:white;text-decoration:none}.wrap{max-width:500px;margin:30px auto;padding:20px}.card{background:white;padding:24px;border-radius:16px}label{display:block;margin-top:14px}input,button{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d0d5dd;border-radius:9px;margin-top:8px;font:inherit}button{background:#172033;color:white;cursor:pointer}p{line-height:1.6;color:#667085}#message{color:#b42318}</style><script src="/security-client.js"></script><script src="/account.js" defer></script></head><body><nav class="nav"><a href="/">Dashboard</a><a href="/settings.html">ตั้งค่า</a><a href="/create.html">สร้างแอด</a></nav><main class="wrap"><div class="card"><h1>บัญชีผู้ดูแล</h1><p id="user"></p><h2>เปลี่ยนรหัสผ่าน</h2><p>เมื่อเปลี่ยนรหัสผ่าน ระบบจะออกจากระบบบนเครื่องอื่นทั้งหมด</p><form id="passwordForm"><label for="current">รหัสผ่านปัจจุบัน</label><input id="current" type="password" autocomplete="current-password" maxlength="128" required><label for="new">รหัสผ่านใหม่อย่างน้อย 12 ตัวอักษร</label><input id="new" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">ยืนยันรหัสผ่านใหม่</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="change" type="submit">เปลี่ยนรหัสผ่าน</button></form><p id="message" role="status" aria-live="polite"></p></div></main></body></html>
