<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>สร้างแอด</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}.nav{background:#172033;padding:14px 22px;display:flex;gap:20px}.nav a{color:white;text-decoration:none;font-weight:700}.wrap{max-width:1180px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 16px #0001}.big{font-size:28px;font-weight:700}.muted{color:#667085}button,input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;margin:5px 0}button{background:#172033;color:#fff;font-weight:700;cursor:pointer}.post{border:1px solid #eee;border-radius:12px;padding:12px;margin:8px 0}.post img{max-width:150px;max-height:150px;border-radius:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="nav"><a href="/">Dashboard</a><a href="/settings.html">ตั้งค่า</a><a href="/create.html">สร้างแอด</a></div><div class="wrap"><h1>สร้างแอดจากโพสต์</h1><div class="card"><label>เลือก Facebook Page</label><select id="page" onchange="posts()"></select><button onclick="posts()">ดึงโพสต์</button><div id="posts"></div></div><div class="card" style="margin-top:15px"><h2>ตั้งค่า Ad</h2><label>Post ID</label><input id="post" readonly><label>ชื่อ Ad</label><input id="name"><label>งบ/วัน (บาท)</label><input id="budget" type="number" value="300"><label>Sub ID</label><input id="sub"><button onclick="create()">สร้างเป็น PAUSED</button><div id="result"></div></div></div><script>async function init(){let j=await(await fetch('/api/meta/pages')).json();page.innerHTML=(j.data||[]).map(p=>'<option value="'+p.id+'">'+p.name+' — '+p.id+'</option>').join('');posts()}async function posts(){let j=await(await fetch('/api/meta/posts?pageId='+encodeURIComponent(page.value))).json();document.querySelector('#posts').innerHTML=j.error?j.error:(j.data||[]).map(x=>'<div class="post">'+(x.full_picture?'<img src="'+x.full_picture+'"><br>':'')+'<b>'+((x.message||'ไม่มีข้อความ').slice(0,120))+'</b><br>Post ID: '+x.id+'<br><button onclick="pick(\''+x.id+'\')">เลือกโพสต์นี้</button></div>').join('')}function pick(id){post.value=id;sub.value='FBPOST_'+id.replace('_','-')}async function create(){let r=await fetch('/api/meta/create-existing-post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pageId:page.value,postId:post.value,name:name.value,dailyBudget:budget.value,subId:sub.value})}),j=await r.json();result.textContent=j.error?j.error:'สร้างสำเร็จ PAUSED | Ad ID: '+j.ad}init()</script></body></html>
