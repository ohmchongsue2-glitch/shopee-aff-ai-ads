<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>สร้างแอด</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}.nav{background:#172033;padding:14px 22px;display:flex;gap:20px}.nav a{color:white;text-decoration:none;font-weight:700}.wrap{max-width:1180px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 3px 16px #0001}.big{font-size:28px;font-weight:700}.muted{color:#667085}button,input,select,textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px;margin:5px 0}button{background:#172033;color:#fff;font-weight:700;cursor:pointer}.post{border:1px solid #eee;border-radius:12px;padding:12px;margin:8px 0}.post img{max-width:150px;max-height:150px;border-radius:8px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="nav"><a href="/">Dashboard</a><a href="/settings.html">ตั้งค่า</a><a href="/create.html">สร้างแอด</a></div><div class="wrap"><h1>สร้างแอดจากโพสต์</h1><div class="card"><label>เลือก Facebook Page</label><select id="page" onchange="posts()"></select><button onclick="posts()">ดึงโพสต์</button><div id="posts" role="status" aria-live="polite"></div></div><div class="card" style="margin-top:15px"><h2>ตั้งค่า Ad</h2><label>Post ID</label><input id="post" readonly><label>ชื่อ Ad</label><input id="name"><label>งบ/วัน (บาท)</label><input id="budget" type="number" value="300"><label>Sub ID</label><input id="sub"><button onclick="create()">สร้างเป็น PAUSED</button><div id="result"></div></div></div><script>const page=document.getElementById('page'),post=document.getElementById('post'),sub=document.getElementById('sub'),result=document.getElementById('result'),list=document.getElementById('posts');let requestId=0;
async function init(){try{const r=await fetch('/api/meta/pages'),j=await r.json();if(!r.ok||j.error)throw Error(j.error||'ดึงเพจไม่สำเร็จ');page.replaceChildren();for(const p of j.data||[]){const o=document.createElement('option');o.value=p.id;o.textContent=p.name+' — '+p.id;page.append(o)}if(!page.value){list.textContent='ไม่พบเพจ กรุณาตรวจสิทธิ์ Meta ในหน้าตั้งค่า';return}await posts()}catch(e){list.textContent=e.message}}
async function posts(){const id=++requestId;post.value='';sub.value='';list.textContent='กำลังดึงโพสต์…';if(!page.value){list.textContent='กรุณาเลือกเพจก่อน';return}try{const r=await fetch('/api/meta/posts?pageId='+encodeURIComponent(page.value)),j=await r.json();if(id!==requestId)return;if(!r.ok||j.error)throw Error(j.error||'ดึงโพสต์ไม่สำเร็จ');list.replaceChildren();if(!(j.data||[]).length){list.textContent='ไม่พบโพสต์ในเพจนี้';return}for(const x of j.data){const card=document.createElement('div');card.className='post';if(x.full_picture){const img=document.createElement('img');img.src=x.full_picture;img.alt='รูปโพสต์';card.append(img)}const text=document.createElement('p');text.textContent=(x.message||'โพสต์ไม่มีข้อความ').slice(0,180);card.append(text);const date=document.createElement('p');date.textContent=x.created_time?new Date(x.created_time).toLocaleString('th-TH'):'';card.append(date);const button=document.createElement('button');button.textContent='เลือกโพสต์นี้';button.onclick=()=>{pick(x.id);list.querySelectorAll('.post').forEach(c=>c.style.outline='');card.style.outline='2px solid #1677ff';result.textContent='เลือกโพสต์แล้ว: '+x.id};card.append(button);list.append(card)}}catch(e){if(id===requestId)list.textContent=e.message}}
function pick(id){post.value=id;sub.value='FBPOST_'+id.replace('_','-')}
async function create(){if(!post.value){result.textContent='กรุณาเลือกโพสต์ก่อนสร้างแอด';return}try{const r=await fetch('/api/meta/create-existing-post',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pageId:page.value,postId:post.value,name:document.getElementById('name').value,dailyBudget:document.getElementById('budget').value,subId:sub.value})}),j=await r.json();result.textContent=j.error?j.error:'สร้างสำเร็จ PAUSED | Ad ID: '+j.ad}catch(e){result.textContent=e.message}}init()</script></body></html>
